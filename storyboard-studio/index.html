<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대본 · 다중 삽화 매칭 스튜디오 (웹)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background: #0f1117;
      color: #e6e8ef;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #171a23;
      border-bottom: 1px solid #2a2f3d;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 15px;
      margin: 0 6px 0 0;
      color: #7dd3fc;
      white-space: nowrap;
    }
    select, button, label.btn {
      background: #232836;
      color: #e6e8ef;
      border: 1px solid #363d52;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    button.primary { background: #2563eb; border-color: #3b82f6; font-weight: 600; }
    button.primary:hover { background: #1d4ed8; }
    button.accent { background: #059669; border-color: #10b981; font-weight: 600; }
    button.danger { background: #7f1d1d; border-color: #991b1b; padding: 3px 8px; font-size: 12px; }
    input[type="file"] { display: none; }
    .status { margin-left: auto; font-size: 12px; color: #9ca3af; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }
    .pane { overflow-y: auto; padding: 16px; }
    .left-pane { border-right: 1px solid #2a2f3d; background: #11131a; }
    .right-pane { background: #151821; }
    .pane-title {
      font-size: 13px;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .para-card {
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #222736;
      background: #181b25;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .para-card:hover { border-color: #3b82f6; }
    .para-card.selected {
      border-color: #38bdf8;
      background: #1c2436;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.3);
    }
    .para-meta {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .para-text { font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
    .inline-slot {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #0d1017;
      border: 1px dashed #38bdf8;
    }
    .inline-slot img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 6px;
      display: block;
      margin-bottom: 6px;
    }
    .slot-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #7dd3fc;
      gap: 8px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .img-card {
      background: #1c202c;
      border: 1px solid #2d3345;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .img-card img { width: 100%; height: 115px; object-fit: cover; background: #0a0c10; }
    .img-info { padding: 8px; font-size: 11px; color: #cbd5e1; display: flex; flex-direction: column; gap: 6px; }
    .img-name { word-break: break-all; line-height: 1.3; }
    .summary-box {
      margin-bottom: 16px;
      padding: 10px 12px;
      background: #1b202e;
      border: 1px solid #2e374d;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>대본 · 다중 삽화 매칭 스튜디오</h1>
    <select id="novelSelect"></select>
    <select id="chapterSelect"></select>
    <label class="btn">+ 대본(.txt)<input type="file" id="addScriptInput" accept=".txt" /></label>
    <label class="btn">+ 삽화 추가<input type="file" id="addImgInput" accept="image/*" multiple /></label>
    <button class="primary" id="saveBtn">매칭 저장</button>
    <button class="accent" id="copyBtn">배치표 복사</button>
    <button id="shareBtn">공유 링크 복사</button>
    <button id="exportBtn">JSON 내보내기</button>
    <label class="btn">JSON 가져오기<input type="file" id="importInput" accept=".json" /></label>
    <span class="status" id="statusText">불러오는 중...</span>
  </header>

  <main>
    <section class="pane left-pane">
      <div class="pane-title">
        <span>대본 (문단을 클릭하면 해당 문단 아래에 삽화가 연결됩니다)</span>
        <span id="selectedInfo" style="color:#38bdf8;">선택된 문단: 없음</span>
      </div>
      <div id="scriptContainer"></div>
    </section>

    <section class="pane right-pane">
      <div class="pane-title">
        <span>상황별 삽화 갤러리 (클릭해서 선택 문단 아래에 추가)</span>
      </div>
      <div class="summary-box" id="summaryBox">현재 회차에 연결된 삽화가 없습니다.</div>
      <div class="gallery-grid" id="galleryContainer"></div>
    </section>
  </main>

  <script>
    const MAP_KEY = 'storyboard_mapping_v1';
    let state = {
      novels: [],
      images: [],
      mapping: {},
      novelId: null,
      chapterId: null,
      selectedParaIdx: 1
    };

    const novelSelect = document.getElementById('novelSelect');
    const chapterSelect = document.getElementById('chapterSelect');
    const scriptContainer = document.getElementById('scriptContainer');
    const galleryContainer = document.getElementById('galleryContainer');
    const summaryBox = document.getElementById('summaryBox');
    const selectedInfo = document.getElementById('selectedInfo');
    const statusText = document.getElementById('statusText');

    function mapKey() { return `${state.novelId}:${state.chapterId}`; }
    function getChapterSlots() { return state.mapping[mapKey()] || []; }
    function setChapterSlots(slots) {
      state.mapping[mapKey()] = slots;
      localStorage.setItem(MAP_KEY, JSON.stringify(state.mapping));
    }

    function getImageUrl(name) {
      const found = state.images.find(i => i.name === name);
      return found ? found.url : `images/${encodeURIComponent(name)}`;
    }

    async function init() {
      const res = await fetch('./data.json');
      const data = await res.json();
      state.novels = data.novels || [];
      state.images = data.images || [];
      try {
        state.mapping = JSON.parse(localStorage.getItem(MAP_KEY) || '{}');
      } catch {
        state.mapping = {};
      }
      if (Object.keys(state.mapping).length === 0 && data.default_mapping) {
        state.mapping = data.default_mapping;
      }
      if (location.hash.startsWith('#share=')) {
        try {
          const b64 = decodeURIComponent(location.hash.slice(7));
          const jsonStr = decodeURIComponent(escape(atob(b64)));
          const shared = JSON.parse(jsonStr);
          state.mapping = { ...state.mapping, ...shared };
          localStorage.setItem(MAP_KEY, JSON.stringify(state.mapping));
        } catch (e) {
          console.warn('Invalid share hash', e);
        }
      }
      renderNovelSelect();
      renderGallery();
      statusText.textContent = `웹 로드 완료 · 대본 ${state.novels.length}종 · 삽화 ${state.images.length}장`;
    }

    function renderNovelSelect() {
      novelSelect.innerHTML = '';
      state.novels.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.textContent = n.title;
        novelSelect.appendChild(opt);
      });
      if (!state.novelId && state.novels.length > 0) state.novelId = state.novels[0].id;
      novelSelect.value = state.novelId;
      populateChapters();
    }

    function populateChapters() {
      const novel = state.novels.find(n => n.id === state.novelId);
      chapterSelect.innerHTML = '';
      if (!novel || novel.chapters.length === 0) return;
      novel.chapters.forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch.id;
        opt.textContent = `${ch.id} (${ch.filename})`;
        chapterSelect.appendChild(opt);
      });
      if (!novel.chapters.some(c => c.id === state.chapterId)) {
        state.chapterId = novel.chapters[novel.chapters.length - 1].id;
      }
      chapterSelect.value = state.chapterId;
      state.selectedParaIdx = 1;
      renderScript();
    }

    function renderScript() {
      const novel = state.novels.find(n => n.id === state.novelId);
      const ch = novel?.chapters.find(c => c.id === state.chapterId);
      scriptContainer.innerHTML = '';
      if (!ch) return;

      const slots = getChapterSlots();
      selectedInfo.textContent = `선택된 문단: #${state.selectedParaIdx + 1}`;

      ch.paragraphs.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'para-card' + (state.selectedParaIdx === idx ? ' selected' : '');
        card.onclick = () => { state.selectedParaIdx = idx; renderScript(); };

        const meta = document.createElement('div');
        meta.className = 'para-meta';
        meta.innerHTML = `<span>문단 #${idx + 1}</span><span>${state.selectedParaIdx === idx ? '▼ 삽화 삽입 대상' : '클릭하여 선택'}</span>`;

        const text = document.createElement('div');
        text.className = 'para-text';
        text.textContent = p;

        card.appendChild(meta);
        card.appendChild(text);

        slots.filter(s => s.paraIdx === idx).forEach(slot => {
          const box = document.createElement('div');
          box.className = 'inline-slot';
          box.onclick = e => e.stopPropagation();

          const img = document.createElement('img');
          img.src = getImageUrl(slot.imageName);

          const bar = document.createElement('div');
          bar.className = 'slot-bar';
          const label = document.createElement('span');
          label.textContent = `배치된 삽화: ${slot.imageName}`;
          const del = document.createElement('button');
          del.className = 'danger';
          del.textContent = '제거';
          del.onclick = () => {
            setChapterSlots(getChapterSlots().filter(x => !(x.paraIdx === idx && x.imageName === slot.imageName)));
            renderScript();
          };
          bar.appendChild(label);
          bar.appendChild(del);
          box.appendChild(img);
          box.appendChild(bar);
          card.appendChild(box);
        });

        scriptContainer.appendChild(card);
      });
      renderSummary();
    }

    function renderSummary() {
      const slots = [...getChapterSlots()].sort((a, b) => a.paraIdx - b.paraIdx);
      if (slots.length === 0) {
        summaryBox.textContent = '현재 회차에 배치된 삽화가 없습니다. 왼쪽에서 문단을 클릭하고 아래 갤러리에서 삽화를 추가하세요.';
        return;
      }
      summaryBox.innerHTML = `<strong>현재 회차 배치 (${slots.length}장):</strong><br>` +
        slots.map((s, i) => `${i + 1}. 문단 #${s.paraIdx + 1} 아래 → <code>${s.imageName}</code>`).join('<br>');
    }

    function renderGallery() {
      galleryContainer.innerHTML = '';
      state.images.forEach(imgInfo => {
        const card = document.createElement('div');
        card.className = 'img-card';

        const img = document.createElement('img');
        img.src = imgInfo.url;
        img.loading = 'lazy';

        const info = document.createElement('div');
        info.className = 'img-info';

        const name = document.createElement('div');
        name.className = 'img-name';
        name.textContent = imgInfo.name;

        const btn = document.createElement('button');
        btn.className = 'primary';
        btn.textContent = '선택 문단 아래에 넣기';
        btn.onclick = () => {
          const slots = getChapterSlots();
          if (!slots.some(s => s.paraIdx === state.selectedParaIdx && s.imageName === imgInfo.name)) {
            slots.push({ paraIdx: state.selectedParaIdx, imageName: imgInfo.name });
            setChapterSlots(slots);
            renderScript();
          }
        };

        info.appendChild(name);
        info.appendChild(btn);
        card.appendChild(img);
        card.appendChild(info);
        galleryContainer.appendChild(card);
      });
    }

    novelSelect.onchange = () => { state.novelId = novelSelect.value; state.chapterId = null; populateChapters(); };
    chapterSelect.onchange = () => { state.chapterId = chapterSelect.value; state.selectedParaIdx = 1; renderScript(); };

    document.getElementById('addScriptInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const paras = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const novel = state.novels.find(n => n.id === state.novelId);
      if (novel) {
        const id = file.name.replace(/\.[^.]+$/, '');
        novel.chapters.push({ id, filename: file.name, paragraphs: paras });
        state.chapterId = id;
        populateChapters();
        statusText.textContent = `새 대본 '${file.name}' 추가됨`;
      }
    };

    document.getElementById('addImgInput').onchange = (e) => {
      for (const file of e.target.files) {
        const url = URL.createObjectURL(file);
        state.images.unshift({ name: file.name, url });
      }
      renderGallery();
      statusText.textContent = `삽화 ${e.target.files.length}장 갤러리에 추가됨`;
    };

    document.getElementById('saveBtn').onclick = () => {
      localStorage.setItem(MAP_KEY, JSON.stringify(state.mapping));
      statusText.textContent = '브라우저 저장 완료 (' + new Date().toLocaleTimeString() + ')';
    };

    document.getElementById('copyBtn').onclick = async () => {
      const novel = state.novels.find(n => n.id === state.novelId);
      const ch = novel?.chapters.find(c => c.id === state.chapterId);
      const slots = [...getChapterSlots()].sort((a, b) => a.paraIdx - b.paraIdx);
      const lines = [`[${novel.title} ${ch.id} 삽화 배치표]`];
      slots.forEach((s, i) => {
        const preview = (ch.paragraphs[s.paraIdx] || '').slice(0, 35);
        lines.push(`${i + 1}. 문단 #${s.paraIdx + 1} ("${preview}...") 아래 -> ${s.imageName}`);
      });
      await navigator.clipboard.writeText(lines.join('\n'));
      statusText.textContent = '배치표를 클립보드에 복사했습니다!';
    };

    document.getElementById('shareBtn').onclick = async () => {
      const jsonStr = JSON.stringify(state.mapping);
      const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
      const url = `${location.origin}${location.pathname}#share=${encodeURIComponent(b64)}`;
      await navigator.clipboard.writeText(url);
      statusText.textContent = '기기 간 동기화 공유 링크를 복사했습니다!';
    };

    document.getElementById('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(state.mapping, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'storyboard_map.json';
      a.click();
    };

    document.getElementById('importInput').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const imported = JSON.parse(await file.text());
        state.mapping = { ...state.mapping, ...imported };
        localStorage.setItem(MAP_KEY, JSON.stringify(state.mapping));
        renderScript();
        statusText.textContent = 'JSON 매칭 데이터를 불러와 저장했습니다!';
      } catch {
        statusText.textContent = '올바른 JSON 파일이 아닙니다.';
      }
    };

    init();
  </script>
</body>
</html>
